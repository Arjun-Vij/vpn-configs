[Proxy Group]
RU-ENTRIES = fallback,url=http://www.gstatic.com/generate_204,interval=60,timeout=5,policy-regex-filter=^VPN-1
ABROAD = fallback,url=http://www.gstatic.com/generate_204,interval=60,timeout=5,policy-regex-filter=^VPN-2
VPN = fallback,RU-ENTRIES,ABROAD,url=http://www.gstatic.com/generate_204,interval=60,timeout=5

