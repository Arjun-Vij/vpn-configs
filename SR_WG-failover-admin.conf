# Shadowrocket: собрано build-routes.py из routes.txt — правь routes.txt, а не этот файл
[General]
bypass-system = true
skip-proxy = 192.168.0.0/16,10.0.0.0/12,10.16.0.0/14,10.20.0.0/20,10.20.16.0/22,10.20.21.0/24,10.20.22.0/23,10.20.24.0/21,10.20.32.0/19,10.20.64.0/18,10.20.128.0/17,10.21.0.0/16,10.22.0.0/15,10.24.0.0/13,10.32.0.0/11,10.64.0.0/10,10.128.0.0/9,172.16.0.0/12,localhost,*.local
